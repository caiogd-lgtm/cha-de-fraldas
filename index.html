<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio Drinks Ano Novo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Map para React e Lucide -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0"
      }
    }
    </script>
    
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Animações customizadas */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        /* Esconder scrollbar no modal mas permitir scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Wine, GlassWater, Citrus, Leaf, Sparkles, X, PartyPopper, Check, Info } from 'lucide-react';

        const drinksData = [
            {
                id: 1,
                name: "Caipirinha Clássica",
                category: "alcohol",
                base: "Cachaça",
                icon: "Citrus",
                description: "O clássico brasileiro. Forte e refrescante.",
                ingredients: [
                    "1 Limão Taiti (sem miolo branco)",
                    "2 colheres (sobremesa) de Açúcar",
                    "60ml de Cachaça",
                    "Gelo filtrado"
                ],
                steps: [
                    "Corte o limão em pedaços e coloque no copo.",
                    "Adicione o açúcar e macere bem.",
                    "Encha o copo de gelo.",
                    "Complete com a cachaça e mexa."
                ],
                color: "bg-lime-100 border-lime-500 text-lime-700",
                iconColor: "text-lime-600"
            },
            {
                id: 2,
                name: "Caipifruta Morango & Hortelã",
                category: "alcohol",
                base: "Cachaça",
                icon: "Leaf",
                description: "Doce com um toque herbal refrescante.",
                ingredients: [
                    "4 a 5 Morangos frescos",
                    "6 folhas de Hortelã",
                    "2 colheres de Açúcar",
                    "60ml de Cachaça",
                    "Gelo"
                ],
                steps: [
                    "Macere os morangos com o açúcar.",
                    "Adicione a hortelã (dê um tapa nas folhas antes).",
                    "Adicione gelo e a cachaça.",
                    "Mexa suavemente."
                ],
                color: "bg-rose-100 border-rose-500 text-rose-700",
                iconColor: "text-rose-600"
            },
            {
                id: 3,
                name: "Sakerinha Tropical",
                category: "alcohol",
                base: "Saquê",
                icon: "Citrus",
                description: "Leve, aromática e sofisticada.",
                ingredients: [
                    "1/2 xícara de Abacaxi em cubos",
                    "2 fatias de Limão Siciliano",
                    "2 colheres de Açúcar",
                    "60ml de Saquê",
                    "Gelo"
                ],
                steps: [
                    "Macere o abacaxi com o açúcar e as fatias de siciliano.",
                    "Encha de gelo.",
                    "Complete com Saquê e mexa bem."
                ],
                color: "bg-yellow-100 border-yellow-500 text-yellow-700",
                iconColor: "text-yellow-600"
            },
            {
                id: 4,
                name: "Sake Spritz",
                category: "alcohol",
                base: "Saquê",
                icon: "Sparkles",
                description: "Drink longo, com borbulhas e muito suave.",
                ingredients: [
                    "3 Morangos fatiados",
                    "60ml de Saquê",
                    "Completar com Sprite/Soda",
                    "Gelo"
                ],
                steps: [
                    "Em uma taça com gelo, coloque o Saquê.",
                    "Complete com Sprite.",
                    "Adicione os morangos fatiados para decorar e aromatizar.",
                    "Mexa levemente."
                ],
                color: "bg-pink-100 border-pink-400 text-pink-700",
                iconColor: "text-pink-500"
            },
            {
                id: 5,
                name: "Mojito de Morango",
                category: "alcohol",
                base: "Rum",
                icon: "Leaf",
                description: "O rei da festa. Refrescante e visualmente lindo.",
                ingredients: [
                    "4 Morangos",
                    "10 folhas de Hortelã",
                    "Suco de 1/2 Limão Taiti",
                    "50ml de Rum Branco",
                    "Água com Gás para completar",
                    "Gelo"
                ],
                steps: [
                    "Macere morangos, suco de limão e açúcar.",
                    "Adicione hortelã e rum.",
                    "Encha de gelo e complete com água com gás."
                ],
                color: "bg-emerald-100 border-emerald-500 text-emerald-700",
                iconColor: "text-emerald-600"
            },
            {
                id: 6,
                name: "Daiquiri Batido",
                category: "alcohol",
                base: "Rum",
                icon: "Wine",
                description: "Cítrico, forte e elegante. Servido sem gelo.",
                ingredients: [
                    "Suco de 1 Limão Taiti",
                    "2 colheres de Açúcar (caprichadas)",
                    "60ml de Rum Branco",
                    "Gelo (para bater)"
                ],
                steps: [
                    "Coloque tudo numa coqueteleira (ou pote com tampa).",
                    "Bata vigorosamente até gelar bem.",
                    "Sirva coado (sem o gelo) numa taça ou copo baixo."
                ],
                color: "bg-orange-100 border-orange-500 text-orange-700",
                iconColor: "text-orange-600"
            },
            {
                id: 7,
                name: "Pink Lemonade",
                category: "non-alcohol",
                base: "Sem Álcool",
                icon: "GlassWater",
                description: "Refrescante e favorita de quem não bebe.",
                ingredients: [
                    "Suco de 1 Limão Siciliano",
                    "2 Morangos macerados",
                    "Sprite ou Água com Gás",
                    "Gelo"
                ],
                steps: [
                    "Macere os morangos no fundo do copo.",
                    "Adicione o suco do limão siciliano.",
                    "Encha de gelo e complete com Sprite."
                ],
                color: "bg-fuchsia-100 border-fuchsia-400 text-fuchsia-700",
                iconColor: "text-fuchsia-500"
            },
            {
                id: 8,
                name: "Abacaxi Hula Hula",
                category: "non-alcohol",
                base: "Sem Álcool",
                icon: "GlassWater",
                description: "Tropical e leve como um dia de spa.",
                ingredients: [
                    "Cubos de Abacaxi",
                    "Muitas folhas de Hortelã",
                    "Água com Gás",
                    "Açúcar a gosto",
                    "Gelo"
                ],
                steps: [
                    "Macere bem o abacaxi com um pouco de açúcar.",
                    "Adicione a hortelã.",
                    "Muito gelo e complete com água com gás."
                ],
                color: "bg-cyan-100 border-cyan-400 text-cyan-700",
                iconColor: "text-cyan-600"
            }
        ];

        // Mapeamento de Ícones para evitar erros de renderização dinâmica
        const IconMap = {
            Citrus: Citrus,
            Leaf: Leaf,
            Sparkles: Sparkles,
            Wine: Wine,
            GlassWater: GlassWater
        };

        function App() {
            const [selectedDrink, setSelectedDrink] = useState(null);
            const [filter, setFilter] = useState('all'); 

            const filteredDrinks = drinksData.filter(drink => {
                if (filter === 'all') return true;
                return drink.category === filter;
            });

            const DrinkIcon = ({ name, className }) => {
                const IconComponent = IconMap[name];
                return IconComponent ? <IconComponent className={className} /> : null;
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans pb-10">
                
                    {/* Header Festivo */}
                    <div className="bg-slate-900 text-white p-6 pt-8 text-center shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-yellow-500 via-amber-200 to-yellow-500 animate-pulse"></div>
                        <h1 className="text-3xl font-extrabold text-yellow-400 flex items-center justify-center gap-2 mb-1">
                            <PartyPopper className="text-yellow-400 w-8 h-8" />
                            Drinks 2026
                        </h1>
                        <p className="text-slate-400 text-sm font-medium">Cardápio Interativo da Virada</p>
                    </div>

                    {/* Filtros Fixos no Topo */}
                    <div className="sticky top-0 z-20 bg-slate-50/95 backdrop-blur-md border-b border-slate-200 shadow-sm p-3">
                        <div className="flex justify-center gap-2 max-w-md mx-auto">
                            <button 
                                onClick={() => setFilter('all')}
                                className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-200 ${filter === 'all' ? 'bg-slate-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 border border-slate-200'}`}
                            >
                                Todos
                            </button>
                            <button 
                                onClick={() => setFilter('alcohol')}
                                className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-200 ${filter === 'alcohol' ? 'bg-slate-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 border border-slate-200'}`}
                            >
                                Com Álcool
                            </button>
                            <button 
                                onClick={() => setFilter('non-alcohol')}
                                className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-200 ${filter === 'non-alcohol' ? 'bg-slate-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-500 border border-slate-200'}`}
                            >
                                Sem Álcool
                            </button>
                        </div>
                    </div>

                    {/* Lista de Drinks */}
                    <div className="max-w-md mx-auto px-4 mt-6 grid gap-4 pb-20">
                        {filteredDrinks.map((drink) => (
                            <div 
                                key={drink.id}
                                onClick={() => setSelectedDrink(drink)}
                                className={`relative p-5 rounded-2xl border-l-[6px] shadow-sm bg-white active:scale-[0.98] transition-all cursor-pointer flex items-center gap-4 ${drink.color.replace('text-', 'border-')}`}
                            >
                                <div className={`p-3 rounded-xl shadow-sm bg-slate-50 ${drink.iconColor}`}>
                                    <DrinkIcon name={drink.icon} className="w-8 h-8" />
                                </div>
                                <div className="flex-1 min-w-0">
                                    <h3 className="font-bold text-lg text-slate-800 truncate">{drink.name}</h3>
                                    <div className="flex items-center gap-2">
                                        <span className={`text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-100 text-slate-500`}>
                                            {drink.base}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1 line-clamp-1">{drink.description}</p>
                                </div>
                                <div className="text-slate-300">
                                    <Info className="w-5 h-5" />
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Footer */}
                    <div className="text-center text-slate-400 text-xs pb-6">
                        <p>Toque no drink para ver a receita</p>
                    </div>

                    {/* Modal Tela Cheia (Bartender View) */}
                    {selectedDrink && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-sm animate-in">
                            <div 
                                className="bg-white w-full h-full sm:h-auto max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col relative"
                                onClick={(e) => e.stopPropagation()}
                            >
                                
                                {/* Header do Modal */}
                                <div className={`relative p-8 pb-10 ${selectedDrink.color.split(' ')[0]} border-b border-black/5`}>
                                    <button 
                                        onClick={() => setSelectedDrink(null)}
                                        className="absolute top-4 right-4 bg-white/60 hover:bg-white p-2 rounded-full transition-colors shadow-sm z-10"
                                    >
                                        <X className="w-6 h-6 text-slate-800" />
                                    </button>
                                    
                                    <div className="flex flex-col items-center justify-center">
                                        <div className="bg-white p-5 rounded-2xl shadow-xl mb-4 transform scale-110">
                                            <DrinkIcon name={selectedDrink.icon} className={`w-12 h-12 ${selectedDrink.iconColor}`} />
                                        </div>
                                        <h2 className="text-3xl font-black text-center text-slate-800 leading-tight">
                                            {selectedDrink.name}
                                        </h2>
                                        <span className="mt-2 text-sm font-bold bg-white/50 px-3 py-1 rounded-full text-slate-700 uppercase tracking-wide">
                                            Base: {selectedDrink.base}
                                        </span>
                                    </div>
                                </div>

                                {/* Conteúdo Scrollável */}
                                <div className="flex-1 overflow-y-auto p-6 space-y-6 bg-white no-scrollbar">
                                    
                                    {/* Ingredientes */}
                                    <div>
                                        <h3 className="flex items-center gap-2 text-xs uppercase tracking-widest font-black text-slate-400 mb-4">
                                            <Sparkles className="w-4 h-4" /> Ingredientes
                                        </h3>
                                        <ul className="space-y-3">
                                            {selectedDrink.ingredients.map((ing, idx) => (
                                                <li key={idx} className="flex items-start gap-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
                                                    <div className="w-1.5 h-1.5 rounded-full bg-yellow-500 mt-2 flex-shrink-0"></div>
                                                    <span className="text-base font-semibold text-slate-700 leading-snug">{ing}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    {/* Preparo */}
                                    <div className="bg-amber-50/50 p-5 rounded-2xl border border-amber-100/50">
                                        <h3 className="flex items-center gap-2 text-xs uppercase tracking-widest font-black text-amber-500 mb-4">
                                            <Check className="w-4 h-4" /> Modo de Preparo
                                        </h3>
                                        <ol className="space-y-5">
                                            {selectedDrink.steps.map((step, idx) => (
                                                <li key={idx} className="flex gap-4 relative">
                                                    <div className="flex-shrink-0 w-8 h-8 rounded-full bg-white border-2 border-amber-200 flex items-center justify-center text-sm font-bold text-amber-600 shadow-sm z-10">
                                                        {idx + 1}
                                                    </div>
                                                    {idx !== selectedDrink.steps.length - 1 && (
                                                        <div className="absolute left-4 top-8 w-0.5 h-full bg-amber-200/50 -z-0"></div>
                                                    )}
                                                    <span className="text-slate-700 leading-snug py-1">{step}</span>
                                                </li>
                                            ))}
                                        </ol>
                                    </div>
                                </div>

                                {/* Botão Fechar Fixo embaixo (Mobile friendly) */}
                                <div className="p-4 bg-white border-t border-slate-100">
                                    <button 
                                        onClick={() => setSelectedDrink(null)}
                                        className="w-full bg-slate-900 text-yellow-400 font-bold py-4 rounded-xl text-lg hover:bg-slate-800 active:scale-[0.98] transition-all shadow-lg flex items-center justify-center gap-2"
                                    >
                                        <Check className="w-5 h-5" />
                                        Pronto, Fechar!
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
